    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-display: 'Plus Jakarta Sans', sans-serif;
            --font-sans: 'Inter', sans-serif;
            --font-cursive: 'Playfair Display', serif;
            --color-logo-gold: #C5A059;
            --color-light-beige: #EFE9DC;
            --color-sme-blue: #0F172A;
            --color-logo-black: #1A1A1A;
        }

        html, body, a, button, select, input, label, [role="button"] {
            cursor: none !important;
        }

        .star-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            line-height: 1;
            user-select: none;
            will-change: transform;
        }
        #main-star {
            font-size: 24px;
            color: rgba(197, 160, 89, 0.9);
            transition: transform 0.1s ease, color 0.2s ease;
        }
        .trail-star {
            font-size: 12px;
            color: rgba(197, 160, 89, 0.4);
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
        }

        @media (pointer: coarse) {
            .star-cursor, .trail-star { display: none !important; }
            html, body, a, button, select, input, label, [role="button"] { cursor: auto !important; }
        }

        .font-display { font-family: var(--font-display); font-weight: 700; }
        .font-cursive { font-family: var(--font-cursive); font-style: italic; }

        .dropdown-menu-list {
            opacity: 0;
            transform: translateY(-8px) scale(0.95);
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dropdown-menu-list.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .flipbook-container {
            perspective: 1500px;
        }
    </style>
</head>
